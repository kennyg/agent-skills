[tools]
# hk pinned to match hk.pkl's schema version so the binary and schema stay in
# lockstep across machines (incl. Linux fleet hosts without brew).
hk = "1.49.0"
# Linters (for hk pre-commit hooks)
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
typos = "latest"

# Python
uv = "latest"
python = "3.13"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks]
check = "hk check --all"
fix = "hk fix --all"
